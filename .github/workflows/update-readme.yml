name: Update README

# Fires whenever LeetPush drops a new solution folder into the repo,
# plus daily (so the streak counter stays honest), plus on demand.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'scripts/problem_cache.json'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history — needed for Day numbers & streak

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh README
        run: python scripts/update_readme.py

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md scripts/problem_cache.json
          if git diff --staged --quiet; then
            echo "nothing to update"
          else
            git commit -m "docs: update README [skip ci]"
            git push
          fi
